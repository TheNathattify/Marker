name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Native build (Fedora)
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            meson ninja-build gcc \
            gtk4-devel libadwaita-devel gtksourceview5-devel webkitgtk6.0-devel \
            glib2-devel gettext itstool

      - name: Build and test
        run: |
          meson setup build
          ninja -C build
          meson test -C build

  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils libglib2.0-bin

      - name: Validate AppStream Metadata
        run: |
          appstreamcli validate --no-net --explain data/com.github.thenathattify.marker.appdata.xml

      - name: Validate Desktop Entry
        run: |
          desktop-file-validate data/com.github.thenathattify.marker.desktop

      - name: Compile GSettings Schema
        run: |
          glib-compile-schemas --strict --dry-run data/

  flatpak:
    name: Flatpak Build
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: com.github.thenathattify.marker.flatpak
          manifest-path: com.github.thenathattify.marker.json
          cache: true
