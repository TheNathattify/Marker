name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils libglib2.0-bin

      - name: Validate AppStream Metadata
        run: |
          appstreamcli validate --no-net --explain data/com.github.thenathattify.marker.appdata.xml

      - name: Validate Desktop Entry
        run: |
          desktop-file-validate data/com.github.thenathattify.marker.desktop

      - name: Compile GSettings Schema
        run: |
          glib-compile-schemas --strict --dry-run data/

  flatpak:
    name: Flatpak Build
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: com.github.thenathattify.marker.flatpak
          manifest-path: com.github.thenathattify.marker.json
          cache: false
