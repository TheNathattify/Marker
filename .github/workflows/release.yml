name: Release

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.release-meta.outputs.tag_name }}
      version: ${{ steps.release-meta.outputs.version }}
      sha: ${{ steps.release-meta.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Extract release metadata
        id: release-meta
        if: ${{ steps.release.outputs.releases_created == 'true' || steps.release.outputs.release_created == 'true' }}
        run: |
          tag="${{ steps.release.outputs.tag_name }}"
          ver="${{ steps.release.outputs.version }}"
          if [ -z "$ver" ] && [ -n "$tag" ]; then
            ver="${tag#v}"
          fi
          sha="${{ steps.release.outputs.sha }}"
          if [ -z "$sha" ]; then
            sha="${{ github.sha }}"
          fi
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  build-deb:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian-trixie
            image: debian:trixie
            deb_suffix: ""
          - target: ubuntu-26.04
            image: ubuntu:26.04
            deb_suffix: _ubuntu26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          submodules: recursive
      - name: Install Debian build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            appstream build-essential ca-certificates debhelper \
            desktop-file-utils gettext itstool libadwaita-1-dev \
            libglib2.0-bin libglib2.0-dev libgtk-4-dev \
            libgtksourceview-5-dev libwebkitgtk-6.0-dev \
            lintian meson ninja-build pkgconf
      - name: Build Debian package
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          DEB_SUFFIX: ${{ matrix.deb_suffix }}
        run: |
          cp -a packaging/debian debian
          mv debian/changelog.in debian/changelog
          release_date=$(date -R)
          sed -i "s/@VERSION@/${VERSION}/g; s/@DATE@/${release_date}/g" debian/changelog
          dpkg-buildpackage --build=binary --no-sign
          mkdir -p dist
          mv "../marker_${VERSION}-1_amd64.deb" dist/
          lintian --fail-on error "dist/marker_${VERSION}-1_amd64.deb"
          if [ -n "$DEB_SUFFIX" ]; then
            mv "dist/marker_${VERSION}-1_amd64.deb" \
              "dist/marker_${VERSION}-1${DEB_SUFFIX}_amd64.deb"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: marker-${{ needs.release-please.outputs.version }}-deb-${{ matrix.target }}
          path: dist/*.deb
          if-no-files-found: error

  validate-deb:
    needs: [release-please, build-deb]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian-trixie
            image: debian:trixie
          - target: ubuntu-26.04
            image: ubuntu:26.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marker-${{ needs.release-please.outputs.version }}-deb-${{ matrix.target }}
          path: dist
      - name: Install and validate Debian package
        env:
          DEBIAN_FRONTEND: noninteractive
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            appstream binutils desktop-file-utils libglib2.0-bin
          apt-get install -y ./dist/*.deb
          dpkg-deb --info ./dist/*.deb
          dpkg-deb --contents ./dist/*.deb
          test "$(dpkg-query --showformat='${Version}' --show marker)" = "${VERSION}-1"
          for path in \
            /usr/bin/marker \
            /usr/share/applications/com.github.adrighem.marker.desktop \
            /usr/share/com.github.adrighem.marker \
            /usr/share/glib-2.0/schemas/com.github.adrighem.marker.gschema.xml \
            /usr/share/icons/hicolor/scalable/apps/com.github.adrighem.marker.svg \
            /usr/share/icons/hicolor/symbolic/apps/com.github.adrighem.marker-symbolic.svg \
            /usr/share/metainfo/com.github.adrighem.marker.appdata.xml; do
            test -e "$path"
          done
          if ldd /usr/bin/marker | grep -q 'not found'; then exit 1; fi
          if readelf -d /usr/bin/marker | grep -Eq '(RPATH|RUNPATH)'; then exit 1; fi
          glib-compile-schemas --strict --dry-run /usr/share/glib-2.0/schemas
          desktop-file-validate /usr/share/applications/com.github.adrighem.marker.desktop
          appstreamcli validate --no-net /usr/share/metainfo/com.github.adrighem.marker.appdata.xml

  build-rpm:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install Fedora build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            --disablerepo=fedora-cisco-openh264 \
            appstream desktop-file-utils gcc gettext git glib2-devel \
            gtk4-devel gtksourceview5-devel itstool libadwaita-devel \
            meson ninja-build pkgconf-pkg-config rpm-build rpmlint \
            tar webkitgtk6.0-devel
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          submodules: recursive
      - name: Build RPM package
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rpm_root="${RUNNER_TEMP}/rpmbuild"
          mkdir -p "$rpm_root"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          tar --transform "flags=r;s,^\.,marker-${VERSION}," --exclude-vcs \
            -czf "$rpm_root/SOURCES/marker-${VERSION}.tar.gz" .
          rpmbuild -bb \
            --define "_topdir $rpm_root" \
            --define "marker_version $VERSION" \
            packaging/rpm/marker.spec
          mkdir -p dist
          find "$rpm_root/RPMS" -name "marker-${VERSION}-1.fc44.x86_64.rpm" \
            -exec cp -v {} dist/ \;
          test -f "dist/marker-${VERSION}-1.fc44.x86_64.rpm"
          rpmlint "dist/marker-${VERSION}-1.fc44.x86_64.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: marker-${{ needs.release-please.outputs.version }}-rpm
          path: dist/*.rpm
          if-no-files-found: error

  validate-rpm:
    needs: [release-please, build-rpm]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marker-${{ needs.release-please.outputs.version }}-rpm
          path: dist
      - name: Install and validate RPM package
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            --disablerepo=fedora-cisco-openh264 \
            appstream binutils desktop-file-utils glib2 rpmlint
          dnf install -y ./dist/*.rpm
          rpm -qip ./dist/*.rpm
          rpm -qlp ./dist/*.rpm
          rpmlint ./dist/*.rpm
          test "$(rpm -q --qf '%{VERSION}-%{RELEASE}' marker)" = "${VERSION}-1.fc44"
          for path in \
            /usr/bin/marker \
            /usr/share/applications/com.github.adrighem.marker.desktop \
            /usr/share/com.github.adrighem.marker \
            /usr/share/glib-2.0/schemas/com.github.adrighem.marker.gschema.xml \
            /usr/share/icons/hicolor/scalable/apps/com.github.adrighem.marker.svg \
            /usr/share/icons/hicolor/symbolic/apps/com.github.adrighem.marker-symbolic.svg \
            /usr/share/metainfo/com.github.adrighem.marker.appdata.xml; do
            test -e "$path"
          done
          if ldd /usr/bin/marker | grep -q 'not found'; then exit 1; fi
          if readelf -d /usr/bin/marker | grep -Eq '(RPATH|RUNPATH)'; then exit 1; fi
          glib-compile-schemas --strict --dry-run /usr/share/glib-2.0/schemas
          desktop-file-validate /usr/share/applications/com.github.adrighem.marker.desktop
          appstreamcli validate --no-net /usr/share/metainfo/com.github.adrighem.marker.appdata.xml

  build-flatpak:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          submodules: recursive
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: marker-${{ needs.release-please.outputs.version }}-x86_64.flatpak
          manifest-path: com.github.adrighem.marker.json
          cache: false

  validate-flatpak:
    needs: [release-please, build-flatpak]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: marker-${{ needs.release-please.outputs.version }}-*.flatpak
          path: dist
          merge-multiple: true
      - name: Install and validate Flatpak bundle
        env:
          APP_ID: com.github.adrighem.marker
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          bundle_count=$(find dist -maxdepth 1 -type f -name '*.flatpak' | wc -l)
          test "$bundle_count" -eq 1
          bundle=$(find dist -maxdepth 1 -type f -name '*.flatpak' -print -quit)
          flatpak install --system --noninteractive --assumeyes "$bundle"
          test "$(flatpak info --system --show-ref "$APP_ID")" = \
            "app/${APP_ID}/x86_64/master"
          test "$(flatpak info --system --show-runtime "$APP_ID")" = \
            "org.gnome.Platform/x86_64/50"
          test -n "$(flatpak info --system --show-commit "$APP_ID")"
          app_root="$(flatpak info --system --show-location "$APP_ID")/files"
          for path in \
            bin/marker \
            share/applications/com.github.adrighem.marker.desktop \
            share/com.github.adrighem.marker \
            share/glib-2.0/schemas/com.github.adrighem.marker.gschema.xml \
            share/icons/hicolor/scalable/apps/com.github.adrighem.marker.svg \
            share/icons/hicolor/symbolic/apps/com.github.adrighem.marker-symbolic.svg \
            share/metainfo/com.github.adrighem.marker.appdata.xml; do
            test -e "${app_root}/${path}"
          done
          flatpak run --system --command=sh "$APP_ID" -c \
            'test -x /app/bin/marker && test -d /app/share/com.github.adrighem.marker'

  publish-assets:
    needs:
      - release-please
      - build-deb
      - validate-deb
      - build-rpm
      - validate-rpm
      - build-flatpak
      - validate-flatpak
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: marker-${{ needs.release-please.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          cd dist
          sha256sum -- *.deb *.rpm *.flatpak > SHA256SUMS
          gh release upload "$TAG_NAME" --clobber -- *.deb *.rpm *.flatpak SHA256SUMS
