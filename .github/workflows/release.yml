name: Release

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-flatpak-asset:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: com.github.adrighem.marker.flatpak
          manifest-path: com.github.adrighem.marker.json
          cache: false

      - name: Generate Checksum
        run: |
          sha256sum com.github.adrighem.marker.flatpak > com.github.adrighem.marker.flatpak.sha256

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: |
            com.github.adrighem.marker.flatpak
            com.github.adrighem.marker.flatpak.sha256

  upload-release-asset:
    needs: [release-please, build-flatpak-asset]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Flatpak Artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle

      - name: Upload Assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" com.github.adrighem.marker.flatpak com.github.adrighem.marker.flatpak.sha256 --clobber
