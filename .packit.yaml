# Packit (https://packit.dev) — official Fedora automation.
# On every release tag (v*), Packit builds the RPM into the COPR project
# thenathattify/marker. Prerequisites (see RELEASE.md):
#   - the packit-service GitHub app installed on this repository
#   - the COPR project thenathattify/marker created with the chroots
#     fedora-43-x86_64, fedora-44-x86_64, fedora-45-x86_64
#     (update twice a year: add the new Fedora, drop the EOL one)
# Packit reads the version from the git tag and updates the spec itself.
# Tags are named vX.Y.Z: strip the leading "v" so the RPM version stays X.Y.Z.
upstream_tag_template: "v{version}"
jobs:
  - job: copr_build
    trigger: release
    specfile_path: packaging/rpm/marker.spec
    owner: thenathattify
    project: marker
    targets:
      - fedora-43-x86_64
      - fedora-44-x86_64
      - fedora-45-x86_64
